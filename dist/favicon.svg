<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark tech gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <!-- Cyan to Sky Neon Accent -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Emerald Glow Accent for Intelligence & Virtus -->
    <linearGradient id="accentEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Subtle Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Glowing Geometric S/V Fusion Symbol -->
  <!-- Left Wing (S/V Ascent) -->
  <path d="M 120 150 L 256 390 L 220 390 L 90 168 A 12 12 0 0 1 120 150 Z" 
        fill="url(#accentCyan)" 
        filter="url(#glow)"/>

  <!-- Right Wing (Virtus Precision Blade) -->
  <path d="M 392 150 L 256 390 L 292 390 L 422 168 A 12 12 0 0 0 392 150 Z" 
        fill="url(#accentEmerald)" 
        filter="url(#glow)"/>

  <!-- Center Core Node / Technological Spark -->
  <circle cx="256" cy="220" r="32" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="220" r="18" fill="#00f0ff"/>

  <!-- Top Apex Nodes (Autonomous agent constellation) -->
  <circle cx="120" cy="150" r="14" fill="#00f0ff"/>
  <circle cx="392" cy="150" r="14" fill="#10b981"/>
</svg>
